<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl Guianne Garcia | Art Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdf5e6; 
            --text-color: #3e2723; 
            --accent-color: #8b4513; 
            --gold-color: #c5a059; 
            --font-heading: 'Cinzel', serif;
            --font-body: 'Playfair Display', serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.40'/%3E%3C/svg%3E");
            color: var(--text-color);
            font-family: var(--font-body);
            line-height: 1.6;
        }

        header {
            position: relative;
            background-image: url('Pictures/background-sketch.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 0 20px 40px 20px; 
            text-align: center;
            border-bottom: 4px double var(--accent-color);
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            overflow: hidden; 
            min-height: 800px; 
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(248, 241, 215, 0.85); 
            z-index: 1;
        }

        .vine-decoration {
            position: absolute;
            top: -20px;
            width: 55%;
            z-index: 5; 
            pointer-events: none;
            filter: sepia(60%) contrast(0.9) drop-shadow(5px 5px 5px rgba(0,0,0,0.3));
            opacity: 0.95;
            transform-origin: top center;
            animation: sway 8s infinite ease-in-out;
        }

        .top-left { left: -30px; }
        .top-right { right: -30px; transform: scaleX(-1); }

        .sign-board {
            position: relative;
            z-index: 10; 
            background-image: url('Pictures/hanging sign.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top center;
            width: 100%;
            max-width: 900px; 
            padding: 220px 50px 90px 50px; 
            margin-top: -65px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.5));
        }

        .profile-img {
            width: 100px; 
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3e2723;
            margin-bottom: 10px;
            background-color: #fff; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #1a0f00; 
            text-shadow: 0px 1px 0px rgba(255,255,255,0.6); 
            font-weight: 700;
            line-height: 1.1;
        }

        .nav-links {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .nav-links span {
            margin: 0 12px;
            cursor: pointer;
            color: #2b1d0e;
            text-shadow: 0px 1px 0px rgba(255,255,255,0.6);
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links span:hover {
            color: #000;
            border-bottom: 2px solid #000;
        }

        .intro-text {
            width: 70%; 
            margin: 0 auto; 
            font-style: italic;
            font-size: 1rem;
            line-height: 1.5;
            color: #1a0f00; 
            font-weight: 600; 
            text-shadow: 0px 1px 0px rgba(255,255,255,0.5); 
        }

        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
            100% { transform: rotate(0deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
            margin-bottom: 60px;

            background-image: url('Pictures/Paper.png');
            background-size: cover;
            background-position: center;

            box-shadow: inset 0 0 0 2000px rgba(253, 245, 230, 0.50);
            
            border-radius: 15px;
            border: 2px solid var(--accent-color);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 60px 40px;
        }

        .art-card {
            text-align: center;
            transition: transform 0.3s ease;

            background-color: rgba(255, 255, 255, 0.92);
            
            padding: 25px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(139, 69, 19, 0.2);
        }

        .art-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            background-color: rgba(255, 255, 255, 1);
        }

        .image-frame {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 6px solid #2b1d0e; 
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease, filter 0.5s ease;
            filter: sepia(30%); 
        }

        .art-card:hover img {
            transform: scale(1.05);
            filter: sepia(0%);
        }

        .art-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 700;
            margin: 10px 0 5px 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-color);
        }

        .art-desc {
            font-size: 0.95rem;
            color: var(--accent-color);
            margin: 0;
            font-style: italic;
            font-weight: 600; 
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            max-width: 90%;
            max-height: 85%;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        @media (max-width: 900px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            
            .sign-board { 
                padding: 180px 40px 60px 40px; 
                margin-top: -50px; 
            }
            h1 { font-size: 1.8rem; }
            .intro-text { width: 80%; }
            .container { padding: 40px 20px; } 
        }
        
        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; }
            .nav-links span { display: block; margin: 5px 0; }
            .vine-decoration { width: 110%; }
            .top-right { display: none; }
            
            .sign-board { 
                width: 98%;
                padding: 120px 15px 40px 15px; 
                margin-top: -40px;
            }
            .profile-img { width: 70px; height: 70px; }
            h1 { font-size: 1.4rem; letter-spacing: 1px; }
            .intro-text { font-size: 0.85rem; width: 85%; }
        }
    </style>
</head>
<body>

    <header>
        <img src="Pictures/vine.png" class="vine-decoration top-left" alt="">
        <img src="Pictures/vine.png" class="vine-decoration top-right" alt="">

        <div class="sign-board">
            <img src="Pictures/Profile.png" alt="Carl Guianne Garcia" class="profile-img">
            
            <h1>Carl Guianne Garcia</h1>
            
            <div class="nav-links">
                <span>Portfolio</span>
                <span>About</span>
                <span>Commissions</span>
                <span>Contact</span>
            </div>

            <p class="intro-text">
                "Step into the pages of my sketchbook. Here lies a collection of visual tales and character studies, 
                drawn from the inkwell of imagination and inspired by the stories of others."
            </p>
        </div>
    </header>

    <div class="container">
        <div class="gallery-grid" id="galleryContainer">
        </div>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        const gallery = document.getElementById('galleryContainer');
        
        const portfolioItems = [
            { file: "20220506_010729.jpg", title: "Disney Villains I", desc: "Graphite Pencil Sketch" },
            { file: "20220506_234301.jpg", title: "Disney Villains II", desc: "Graphite Pencil Sketch" },
            { file: "20220515_002943.jpg", title: "Disney Villains III", desc: "Graphite Pencil Sketch" },
            { file: "20220517_193351.jpg", title: "Disney Villains IV", desc: "Graphite Pencil Sketch" },
            { file: "20220627_160008.jpg", title: "Mad Hatter's Portrait", desc: "Graphite Pencil Sketches" },
            { file: "20220704_123011.jpg", title: "Warcraft Ink Sketches", desc: "Ink Pen Sketches" },
            { file: "20220706_151040.jpg", title: "Portrait Study", desc: "Ink Pen Sketch" },
            { file: "20220729_003843.jpg", title: "Object Study Sketches", desc: "Graphite Pencil Sketch" },
            { file: "20220729_003821.jpg", title: "Interior Study Sketches", desc: "Graphite Pencil Sketch" },
            { file: "20220810_115258.jpg", title: "Dumbledore's Portrait", desc: "Graphite Pencil Sketch" },
            { file: "20220810_192344.jpg", title: "Belatrix Lestrange's Portrait", desc: "Graphite Pencil Sketch" },
            { file: "20220821_165609.jpg", title: "Captain Armando Salazar's Portrait", desc: "Ink and Colored Pencil" },
            { file: "20220910_201128.jpg", title: "Jose Mari Chan's Portrait", desc: "Watercolor and Ink" },
            { file: "20220911_232201.jpg", title: "Queen Elizabeth II Portrait", desc: "Watercolor and Ink" },
            { file: "20221016_021237.jpg", title: "Winifred Sanderson's Portrait", desc: "Graphite Pencil Sketch" },
            { file: "CamScanner 07-13-2022 01.46.jpg", title: "Davy Jones", desc: "Ink and Colored Pencil" },
            { file: "20240710_020234.jpg", title: "My Grandmother's Portrait", desc: "Watercolor and Ink" },
            { file: "20240715_021928.jpg", title: "My Mom's Baby Portrait", desc: "Ink Pen Sketch" },
            { file: "DSC00271.png", title: "Kingsley Ink Sketch", desc: "Ink Pen Sketches" },
            { file: "DSC00274.png", title: "Kingsley's Crown Concept Designs", desc: "Ink Pen Sketches" },
            { file: "DSC00275.png", title: "Kingsley Portrait", desc: "Graphite Pencil Sketch" },
            { file: "Kamahalan Prompt.png", title: "Kamahalan Prompt", desc: "Mixed Media" }
        ];

        portfolioItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'art-card';

            const imagePath = `Pictures/${item.file}`;

            card.innerHTML = `
                <div class="image-frame" onclick="openModal(this)">
                    <img src="${imagePath}" alt="${item.title}">
                </div>
                <h3 class="art-title">${item.title}</h3>
                <p class="art-desc">${item.desc}</p>
            `;
            gallery.appendChild(card);
        });

        function openModal(element) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImg");
            const src = element.querySelector('img').src;
            modal.style.display = "flex";
            modalImg.src = src;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>
</body>
</html>
